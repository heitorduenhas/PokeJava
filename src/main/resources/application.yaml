server:
  port: 8080
  servlet:
    context-path: '/pokejava/'

spring:
  datasource:
    url:  jdbc:postgresql://localhost:5432/pokejava
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          lob:
            non-contextual-creation: true